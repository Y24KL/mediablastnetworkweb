<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediablast Network | Reaching Every World</title>

    <link rel="icon" type="image/png" href="image/MEDIA BLAST.png?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <style>
        /* ==================== GLOBAL LIGHT MODE ==================== */
        body {
            background-color: #ffffff;
            color: #222;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        h1, h2, h3, h4, p, span:not(.live-indicator) {
            color: #111;
        }

        /* Glass effect (light) */
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        /* ==================== NAV ==================== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            z-index: 1000;
        }

        .menu-toggle {
            display: flex !important;
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: #111;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 8px;
            z-index: 1100;
        }

        .nav-wrapper {
            position: fixed;
            top: 0;
            right: -100%;
            width: 300px;
            height: 100vh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: 0.4s ease-in-out;
            box-shadow: -10px 0 30px rgba(0,0,0,0.2);
            z-index: 1050;
        }

        .nav-wrapper.active {
            right: 0;
        }

        .nav-links {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
        }

        .nav-links a {
            text-decoration: none;
            color: #111;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: #ff4d4d;
        }

        #theme-toggle { display: none; }
    </style>
</head>

<body>

    <!-- Loader -->
    <div id="loader">
        <div class="loader-content">
            <div class="spinner"></div>
            <img src="image/MEDIA BLAST.png" alt="Logo" class="loader-logo">
        </div>
    </div>

    <!-- NAV -->
    <nav class="navbar glass sticky">
        <a href="#home" class="logo-link">
            <img src="image/MEDIA BLAST.png" alt="Logo" class="nav-logo-img">
        </a>

        <button class="menu-toggle" id="menu-toggle">
            <i class="fas fa-bars"></i>
        </button>

        <div class="nav-wrapper" id="nav-wrapper">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="live.html">Live TV</a></li>
                <li><a href="programs.html">Programs</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- HERO -->
    <header id="home" class="hero">
        <video autoplay muted loop class="hero-video">
            <source src="videos/LOVEWORLD WORSHIP APP PROMO.mp4" type="video/mp4">
        </video>

        <div class="hero-overlay"></div>

        <div class="hero-content">
            <h1>Reaching <br><span class="gradient-text">Every World</span></h1>
            <p>Experience the next generation of digital media.</p>

            <div class="cta-group">
                <a href="live.html" class="btn btn-primary">Watch Live Now</a>
                <a href="programs.html" class="btn btn-outline">View Schedule</a>
            </div>
        </div>
    </header>

    <!-- TEASER -->
    <section class="teaser-section">
        <div class="container">
            <div class="teaser-glass glass">
                <div class="teaser-content">
                    <span class="live-indicator">UPCOMING</span>
                    <h2>TESTIMONIES OF PRAISE</h2>
                    <p>Don’t miss tonight’s episode.</p>
                    <a href="live.html" class="btn btn-primary">Watch Live</a>
                </div>
                <div class="teaser-preview">
                    <img src="image/image_1777225763.jpg" alt="Preview">
                </div>
            </div>
        </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="contact-section">
        <div class="container">
            <div class="contact-grid glass">

                <div class="contact-info">
                    <h2 class="gradient-text">Contact Us</h2>
                    <p>Reach out anytime.</p>
                </div>

                <form action="https://formspree.io/f/meepelvp" method="POST">
                    <input type="text" name="name" placeholder="Name" required>
                    <input type="email" name="email" placeholder="Email" required>
                    <textarea name="message" placeholder="Message"></textarea>
                    <button type="submit">Send</button>
                </form>

            </div>
        </div>
    </section>

    <!-- SCRIPT -->
    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const navWrapper = document.getElementById('nav-wrapper');
        const menuIcon = menuToggle.querySelector('i');

        menuToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            navWrapper.classList.toggle('active');

            menuIcon.classList.toggle('fa-bars');
            menuIcon.classList.toggle('fa-times');
        });

        document.addEventListener('click', (e) => {
            if (!navWrapper.contains(e.target) && !menuToggle.contains(e.target)) {
                navWrapper.classList.remove('active');
                menuIcon.classList.add('fa-bars');
                menuIcon.classList.remove('fa-times');
            }
        });
    </script>

</body>
</html>
