<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE | Mediablasst Network</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .back-home {
            color: white;
            text-decoration: none;
            font-size: 14px;
            margin-left: 20px;
            padding: 8px 14px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            transition: 0.3s;
        }

        .back-home:hover {
            background: rgba(255,255,255,0.2);
        }

        .stats-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .stats-pill i {
            color: #ff4d4d;
        }
    </style>
</head>

<body class="live-theater-mode">

<div id="live-content">

    <!-- NAV -->
    <nav class="live-nav glass">
        <div class="logo">
            <a href="index.html">
                <img src="image/MEDIA BLAST.png" alt="Mediablast Logo" style="height: 40px;">
            </a>
        </div>

        <div class="live-meta">
            <span class="live-indicator">
                <i class="fas fa-circle"></i> LIVE
            </span>

            <div class="stats-pill">
                <i class="fas fa-eye"></i>
                <span id="viewerCount">0</span>
            </div>

            <!-- BACK BUTTON -->
            <a href="index.html" class="back-home">
                ← Back to Home
            </a>
        </div>
    </nav>

    <!-- MAIN -->
   <main class="live-compact-container">
        <section class="video-section-compact">
            <div class="video-wrapper glass">
                <video id="live-player" controls autoplay playsinline style="width:100%; height:100%; border-radius: 12px;">
                    Your browser does not support the video tag.
                </video>
            </div>

            <div class="video-details-compact">
                <h1 id="stream-title">Mediablasst Exclusive Feed</h1>
            </div>
        </section>
    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, set, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDzDUQ1i_CPP_nL4aTefmKPADzM-UVcCt0",
    authDomain: "mbn-web-828e8.firebaseapp.com",
    databaseURL: "https://mbn-web-828e8-default-rtdb.firebaseio.com",
    projectId: "mbn-web-828e8",
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

 // --- ENHANCED VIEWER COUNT LOGIC ---
  const userId = "user_" + Math.random().toString(36).substr(2, 9);
  const userStatusRef = ref(db, 'status/' + userId);
  const viewerCountDisplay = document.getElementById("viewerCount");

  // 1. Create a reference to the 'status' folder in your database
  // When the user connects, we set their status to "online"
  set(userStatusRef, {
    online: true,
    last_changed: Date.now()
  });

  // 2. The MAGIC: When the user leaves/closes the tab, delete their record
  onDisconnect(userStatusRef).remove();

  // 3. Listen for changes in the 'status' folder
  const allStatusRef = ref(db, 'status');
  onValue(allStatusRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
      // The number of keys in the 'status' folder = number of people watching
      const count = Object.keys(data).length;
      if(viewerCountDisplay) {
        viewerCountDisplay.innerText = count;
      }
    } else {
      if(viewerCountDisplay) viewerCountDisplay.innerText = "0";
    }
  });

  // --- CMS SYNC LOGIC ---
  async function syncWithCMS() {
    try {
      const response = await fetch('/settings.json');
      if (!response.ok) throw new Error('Settings file not found');
      const settings = await response.json();
      
      const video = document.getElementById('live-player');
      
      // Determine which URL to use (Live or Backup)
      const streamUrl = settings.is_live ? settings.stream_url : settings.backup_url;

      if (streamUrl) {
        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(streamUrl);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(e => console.log("Autoplay blocked, user must click play."));
          });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = streamUrl;
        }
      } else {
        console.log("No stream URL or backup URL provided in CMS.");
      }
    } catch (error) {
      console.log("CMS sync error:", error.message);
    }
  }

  syncWithCMS();
</script>
