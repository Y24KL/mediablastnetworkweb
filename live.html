<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE | Mediablasst Network</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .back-home {
            color: white;
            text-decoration: none;
            font-size: 14px;
            margin-left: 20px;
            padding: 8px 14px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            transition: 0.3s;
        }

        .back-home:hover {
            background: rgba(255,255,255,0.2);
        }

        .stats-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .stats-pill i {
            color: #ff4d4d;
        }
    </style>
</head>

<body class="live-theater-mode">

<div id="live-content">

    <!-- NAV -->
    <nav class="live-nav glass">
        <div class="logo">
            <a href="index.html">
                <img src="image/MEDIA BLAST.png" alt="Mediablast Logo" style="height: 40px;">
            </a>
        </div>

        <div class="live-meta">
            <span class="live-indicator">
                <i class="fas fa-circle"></i> LIVE
            </span>

            <div class="stats-pill">
                <i class="fas fa-eye"></i>
                <span id="viewerCount"></span>
            </div>

            <!-- BACK BUTTON -->
            <a href="index.html" class="back-home">
                ← Back to Home
            </a>
        </div>
    </nav>

    <!-- MAIN -->
<main class="live-compact-container">
    <section class="video-section-compact">
        <div class="video-wrapper glass" id="media-container">
            <p style="color: white; text-align: center; padding: 20px;">Connecting to Mediablast Network...</p>
        </div>

        <div class="video-details-compact">
            <h1 id="stream-title">Mediablasst Exclusive Feed</h1>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
async function syncWithCMS() {
  const container = document.getElementById('media-container');
  const liveIndicator = document.querySelector('.live-indicator');

  try {
    const res = await fetch('/content/settings/livestream.json?ts=' + Date.now());
    const data = await res.json();

    // LIVE mode
    if (data.status === "live" && data.m3u8_url) {
      liveIndicator.style.display = "inline-flex";
      container.innerHTML = `
        <video id="live-player" controls autoplay playsinline
          style="width:100%; height:100%; object-fit:contain;"></video>
      `;
      const video = document.getElementById('live-player');
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(data.m3u8_url);
        hls.attachMedia(video);
      } else {
        video.src = data.m3u8_url;
      }
    } else {
      // OFFLINE mode
      liveIndicator.style.display = "none";
      container.innerHTML = `
        <video id="bg-video" autoplay muted loop playsinline
          style="width:100%; height:100%; object-fit:cover;">
        </video>
      `;
      document.getElementById('bg-video').src = data.background_video;
    }
  } catch (err) {
    console.error(err);
    container.innerHTML = `<p style="color:white">Failed to load stream</p>`;
  }
}

syncWithCMS();
setInterval(syncWithCMS, 10000);
</script>
