<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE | Mediablasst Network</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .back-home {
            color: white;
            text-decoration: none;
            font-size: 14px;
            margin-left: 20px;
            padding: 8px 14px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            transition: 0.3s;
        }

        .back-home:hover {
            background: rgba(255,255,255,0.2);
        }

        .stats-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .stats-pill i {
            color: #ff4d4d;
        }
    </style>
</head>

<body class="live-theater-mode">

<div id="live-content">

    <!-- NAV -->
    <nav class="live-nav glass">
        <div class="logo">
            <a href="index.html">
                <img src="image/MEDIA BLAST.png" alt="Mediablast Logo" style="height: 40px;">
            </a>
        </div>

        <div class="live-meta">
            <span class="live-indicator">
                <i class="fas fa-circle"></i> LIVE
            </span>

            <div class="stats-pill">
                <i class="fas fa-eye"></i>
                <span id="viewerCount"></span>
            </div>

            <!-- BACK BUTTON -->
            <a href="index.html" class="back-home">
                ← Back to Home
            </a>
        </div>
    </nav>

    <!-- MAIN -->
<main class="live-compact-container">
    <section class="video-section-compact">
        <div class="video-wrapper glass" id="media-container">
            <p style="color: white; text-align: center; padding: 20px;">Connecting to Mediablast Network...</p>
        </div>

        <div class="video-details-compact">
            <h1 id="stream-title">Mediablasst Exclusive Feed</h1>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
async function syncWithCMS() {
  const container = document.getElementById('media-container');
  const liveIndicator = document.querySelector('.live-indicator');

  try {
    // Fetches the latest settings from your CMS path
    const res = await fetch('/content/settings/livestream.json?nocache=' + new Date().getTime(), {
    cache: 'no-store'
});
    if (!res.ok) throw new Error('Settings not found');
    const data = await res.json();

    // LIVE mode logic
   // Check if it's explicitly set to live
if (data.status === "live") {
    console.log("Status is LIVE - Loading m3u8");
    liveIndicator.style.display = "inline-flex";
    // ... your HLS player code ...
} else {
    // This will run for "offline" OR any other error/status
    console.log("Status is OFFLINE - Loading Background Video");
    liveIndicator.style.display = "none";
    container.innerHTML = `
        <video id="bg-video" autoplay muted loop playsinline
          style="width:100%; height:100%; object-fit:cover;">
          <source src="${data.background_video}" type="video/mp4">
        </video>
    `;
}
    // OFFLINE mode logic
    else {
      liveIndicator.style.display = "none";
      // We inject the full HTML at once to ensure the video source is registered correctly
      container.innerHTML = `
        <video id="bg-video" autoplay muted loop playsinline
          style="width:100%; height:100%; object-fit:cover;">
          <source src="${data.background_video}" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      `;
    }
  } catch (err) {
    console.error("CMS Sync Error:", err);
    container.innerHTML = `<p style="color:white; text-align:center;">Feed currently unavailable</p>`;
  }
}

// Only runs once when the page loads
syncWithCMS();

// The 15-second interval has been removed to prevent refreshing
</script>
