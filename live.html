<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE | Mediablasst Network</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .back-home {
            color: white;
            text-decoration: none;
            font-size: 14px;
            margin-left: 20px;
            padding: 8px 14px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            transition: 0.3s;
        }

        .back-home:hover {
            background: rgba(255,255,255,0.2);
        }

        .stats-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .stats-pill i {
            color: #ff4d4d;
        }
    </style>
</head>

<body class="live-theater-mode">

<div id="live-content">

    <!-- NAV -->
    <nav class="live-nav glass">
        <div class="logo">
            <a href="index.html">
                <img src="image/MEDIA BLAST.png" alt="Mediablast Logo" style="height: 40px;">
            </a>
        </div>

        <div class="live-meta">
            <span class="live-indicator">
                <i class="fas fa-circle"></i> LIVE
            </span>

            <div class="stats-pill">
                <i class="fas fa-eye"></i>
                <span id="viewerCount"></span>
            </div>

            <!-- BACK BUTTON -->
            <a href="index.html" class="back-home">
                ← Back to Home
            </a>
        </div>
    </nav>

    <!-- MAIN -->
<main class="live-compact-container">
    <section class="video-section-compact">
        <div class="video-wrapper glass" id="media-container">
            <p style="color: white; text-align: center; padding: 20px;">Connecting to Mediablast Network...</p>
        </div>

        <div class="video-details-compact">
            <h1 id="stream-title">Mediablasst Exclusive Feed</h1>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script type="module">
  // ... (Your Firebase code remains exactly the same here) ...

  // --- CMS & STREAM LOGIC ---
  async function syncWithCMS() {
    try {
      // 1. MATCH THE CMS PATH: Changed from '/settings.json' to the real path
      const response = await fetch('/content/settings/livestream.json');
      if (!response.ok) throw new Error('CMS Settings not found');
      
      const data = await response.json();
      const container = document.getElementById('media-container');
      const titleDisplay = document.getElementById('stream-title');

      // Update the Title from CMS
      if (data.title) titleDisplay.innerText = data.title;

      // 2. CHECK STATUS (Live vs Offline)
      if (data.status === 'live' && data.m3u8_url) {
        // --- 🔴 SHOW LIVE PLAYER ---
        container.innerHTML = `<video id="live-player" controls autoplay playsinline style="width:100%; height:100%; border-radius: 12px;"></video>`;
        const video = document.getElementById('live-player');
        const streamUrl = data.m3u8_url;

        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(streamUrl);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(() => console.log("Autoplay blocked."));
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = streamUrl;
        }
      } else {
        // --- ⏸️ SHOW OFFLINE BACKGROUND VIDEO ---
        container.innerHTML = `
          <video id="bg-video" autoplay muted loop playsinline style="width:100%; height:100%; border-radius: 12px; object-fit: cover;">
            <source src="${data.background_video}" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        `;
      }
    } catch (error) {
      console.log("CMS Sync Error: Ensure you have published once in /admin", error.message);
    }
  }

  syncWithCMS();
</script>
