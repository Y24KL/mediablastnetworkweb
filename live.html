<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE | Mediablast Network</title>

    <link rel="icon" type="image/png" href="image/MEDIA BLAST.png?v=2">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <style>
        .video-wrapper {
            background: #000;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            aspect-ratio: 16 / 9;
        }

        #live-player, #bg-video {
            width: 100%;
            height: 100%;
            display: block;
        }

        .back-home {
            color: white;
            text-decoration: none;
            font-size: 14px;
            margin-left: 20px;
            padding: 8px 14px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            transition: 0.3s;
        }

        .back-home:hover { background: rgba(255,255,255,0.2); }

        .stats-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            color: white;
        }
        
        .live-indicator {
            display: none;
            align-items: center;
            gap: 5px;
            color: #ff4d4d;
            font-weight: bold;
        }

        #media-container iframe, #media-container video {
            border-radius: 20px;
        }
    </style>
</head>

<body class="live-theater-mode">

<div id="live-content">
    <nav class="live-nav glass">
        <div class="logo">
            <a href="index.html">
                <img src="image/MEDIA BLAST.png" alt="Mediablast Logo" style="height: 40px;">
            </a>
        </div>

        <div class="live-meta" style="display: flex; align-items: center; gap: 15px;">
            <span class="live-indicator">
                <i class="fas fa-circle"></i> LIVE
            </span>

            <a href="index.html" class="back-home">← Back to Home</a>
        </div>
    </nav>

    <main class="live-compact-container">
        <section class="video-section-compact">
            <div id="media-container" style="width: 100%; max-width: 900px; aspect-ratio: 16/9; background: #000; border-radius: 20px; overflow: hidden; margin: 20px auto; position: relative;">
                </div>

            <div class="video-details-compact" style="text-align: center;">
                <h1 id="stream-title" style="color: white; font-size: 1.5rem; margin-top: 15px;">Loading Stream...</h1>
            </div>
        </section>
    </main>
</div>
    
<div id="pre-stream-overlay" class="stream-overlay">
        <div class="stream-modal">
            <div class="modal-header">
                <h2>Welcome to Mediablast Network Live Stream</h2>
                <p>Tell us who’s watching with you 🍿</p>
            </div>
            
            <form id="viewer-form">
                <div class="input-group">
                    <label for="viewer-name">Your Name</label>
                    <input type="text" id="viewer-name" placeholder="Enter your name" required>
                </div>
                
                <div class="input-group">
                    <label for="viewer-count">Number of people watching</label>
                    <div class="stepper">
                        <button type="button" id="step-down" class="step-btn">−</button>
                        <input type="number" id="viewer-count" value="1" min="1" required>
                        <button type="button" id="step-up" class="step-btn">+</button>
                    </div>
                </div>

                <button type="submit" id="join-stream-btn" class="cta-btn">
                    <span id="btn-text">Join Live Stream</span>
                    <span id="btn-spinner" class="spinner" style="display: none;"></span>
                </button>
            </form>
        </div>
    </div>

<script>
// --- FIREBASE CONFIG ---
const firebaseConfig = {
    apiKey: "AIzaSyDzDUQ1i_CPP_nL4aTefmKPADzM-UVcCt0",
    authDomain: "mbn-web-828e8.firebaseapp.com",
    databaseURL: "https://mbn-web-828e8-default-rtdb.firebaseio.com",
    projectId: "mbn-web-828e8",
    storageBucket: "mbn-web-828e8.firebasestorage.app",
    messagingSenderId: "432152602008",
    appId: "1:432152602008:web:a492785cad9a1219b337ed",
    measurementId: "G-FP2CCWHF13"
};

// Initialize Firebase
if (typeof firebase !== 'undefined') {
    firebase.initializeApp(firebaseConfig);
    console.log("✅ Firebase Initialized");
} else {
    console.error("❌ Firebase script not loaded! Check your <script> tags in <head>");
}

const database = firebase.database();

document.addEventListener('DOMContentLoaded', () => {
    console.log("🚀 Page Loaded, initializing modal logic...");

    const overlay = document.getElementById('pre-stream-overlay');
    const form = document.getElementById('viewer-form');
    const nameInput = document.getElementById('viewer-name');
    const countInput = document.getElementById('viewer-count');
    const stepUp = document.getElementById('step-up');
    const stepDown = document.getElementById('step-down');

    if (!overlay || !form) {
        console.error("❌ Modal elements not found in DOM. Check your HTML IDs.");
        return;
    }

    // Load saved name
    if(localStorage.getItem('mbn_name')) nameInput.value = localStorage.getItem('mbn_name');

    // Stepper logic
    stepUp.onclick = () => {
        countInput.value = parseInt(countInput.value) + 1;
    };
    stepDown.onclick = () => { 
        if(parseInt(countInput.value) > 1) countInput.value = parseInt(countInput.value) - 1; 
    };

    // Form Submission
    form.onsubmit = async (e) => {
        e.preventDefault();
        console.log("📩 Form submitted. Attempting to save to Firebase...");
        
        const viewerData = {
            name: nameInput.value.trim(),
            groupSize: parseInt(countInput.value),
            timestamp: firebase.database.ServerValue.TIMESTAMP
        };

        try {
            // 1. Log entrance record
            await database.ref('stream_entries').push(viewerData);
            console.log("📡 Entrance logged to Firebase");

            // 2. Presence
            const presenceRef = database.ref('liveViewers').push(viewerData.groupSize);
            presenceRef.onDisconnect().remove();
            console.log("👥 Presence established");

            // 3. UI Transition
            localStorage.setItem('mbn_name', viewerData.name);
            overlay.classList.add('fade-out');
            console.log("🎬 Hiding modal, triggering stream...");
            
            // Trigger Stream
            syncWithCMS();
            
            setTimeout(() => {
                overlay.remove();
                console.log("🧹 Modal removed from DOM");
            }, 500);

        } catch (err) {
            console.error("❌ Firebase Error:", err);
            // Even if Firebase fails, let them watch
            overlay.classList.add('fade-out');
            syncWithCMS();
        }
    };
});

// --- CMS & PLAYER LOGIC ---
async function syncWithCMS() {
    console.log("📡 Fetching CMS settings...");
    const container = document.getElementById('media-container');
    const liveIndicator = document.querySelector('.live-indicator');
    const titleHeader = document.getElementById('stream-title');

    try {
        const res = await fetch('/data/links.json?nocache=' + Date.now());
        const data = await res.json();
        console.log("📄 CMS Data received:", data);

        if (data.title) titleHeader.innerText = data.title;

        const ytId = getYouTubeID(data.youtubeLink);
        const streamUrl = data.liveStream || "";
        const isLive = data.status === "live";

        if (!isLive) {
            console.log("⏸️ Stream is offline, showing hero video");
            showOfflineMode(container, liveIndicator, data.heroVideo);
            return;
        }

        liveIndicator.style.display = "inline-flex";

        if (ytId) {
            console.log("📺 Loading YouTube Player...");
            container.innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${ytId}?autoplay=1&mute=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        } 
        else if (streamUrl.includes(".m3u8")) {
            console.log("📺 Loading HLS Player...");
            container.innerHTML = `<video id="live-player" controls autoplay playsinline style="width:100%; height:100%;"></video>`;
            const video = document.getElementById('live-player');
            
            if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
            }
        }
        else {
            console.warn("⚠️ No valid stream link found.");
            showOfflineMode(container, liveIndicator, data.heroVideo);
        }
    } catch (err) {
        console.error("❌ Sync Error:", err);
    }
}

function showOfflineMode(container, indicator, videoUrl) {
    if (indicator) indicator.style.display = "none";
    container.innerHTML = `
      <div style="position: relative; width: 100%; height: 100%;">
          <video id="bg-video" autoplay muted loop playsinline style="width:100%; height:100%; object-fit:cover;">
            <source src="${videoUrl}" type="video/mp4">
          </video>
          <button id="volume-toggle" style="position: absolute; bottom: 20px; right: 20px; z-index: 10; background: rgba(0,0,0,0.7); color: white; border: 1px solid white; padding: 10px 18px; border-radius: 25px; cursor: pointer;">
              Unmute Sound
          </button>
      </div>
    `;

    const v = document.getElementById('bg-video');
    const btn = document.getElementById('volume-toggle');
    if (v && btn) {
        btn.onclick = () => {
            v.muted = !v.muted;
            btn.innerText = v.muted ? 'Unmute Sound' : 'Mute Audio';
        };
    }
}

function getYouTubeID(url) {
    if (!url) return null;
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
    const match = url.match(regExp);
    return (match && match[2].length === 11) ? match[2] : null;
}
