<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE | Mediablasst Network</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .back-home {
            color: white;
            text-decoration: none;
            font-size: 14px;
            margin-left: 20px;
            padding: 8px 14px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            transition: 0.3s;
        }

        .back-home:hover {
            background: rgba(255,255,255,0.2);
        }

        .stats-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .stats-pill i {
            color: #ff4d4d;
        }
    </style>
</head>

<body class="live-theater-mode">

<div id="live-content">

    <!-- NAV -->
    <nav class="live-nav glass">
        <div class="logo">
            <a href="index.html">
                <img src="image/MEDIA BLAST.png" alt="Mediablast Logo" style="height: 40px;">
            </a>
        </div>

        <div class="live-meta">
            <span class="live-indicator">
                <i class="fas fa-circle"></i> LIVE
            </span>

            <div class="stats-pill">
                <i class="fas fa-eye"></i>
                <span id="viewerCount">0</span>
            </div>

            <!-- BACK BUTTON -->
            <a href="index.html" class="back-home">
                ← Back to Home
            </a>
        </div>
    </nav>

    <!-- MAIN -->
    <main class="live-compact-container">
        <section class="video-section-compact">
            <div class="video-wrapper glass">
                <iframe id="yt-player" 
                    src="https://www.youtube.com/embed/3umsy4MqUSM?autoplay=1&mute=0" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>

            <div class="video-details-compact">
                <h1>Mediablasst Exclusive Feed</h1>
            </div>
        </section>
    </main>

</div>

<!-- FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, set, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDzDUQ1i_CPP_nL4aTefmKPADzM-UVcCt0",
    authDomain: "mbn-web-828e8.firebaseapp.com",
    databaseURL: "https://mbn-web-828e8-default-rtdb.firebaseio.com",
    projectId: "mbn-web-828e8",
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const userId = "user_" + Math.random().toString(36).substr(2, 9);
  const viewersRef = ref(db, "viewers/" + userId);

  set(viewersRef, true);
  onDisconnect(viewersRef).remove();

  const allViewersRef = ref(db, "viewers");

  onValue(allViewersRef, (snapshot) => {
    const data = snapshot.val();
    const count = data ? Object.keys(data).length : 0;
    document.getElementById("viewerCount").innerText = count;
  });
</script>

</body>
</html>
