<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE | Mediablast Network</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* Professional enhancements for the player */
        .video-wrapper {
            background: #000;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            aspect-ratio: 16 / 9;
        }

        #live-player, #bg-video {
            width: 100%;
            height: 100%;
            display: block;
        }

        .back-home {
            color: white;
            text-decoration: none;
            font-size: 14px;
            margin-left: 20px;
            padding: 8px 14px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            transition: 0.3s;
        }

        .back-home:hover { background: rgba(255,255,255,0.2); }

        .stats-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        .live-indicator {
            display: none; /* Hidden by default, shown by JS */
            align-items: center;
            gap: 5px;
            color: #ff4d4d;
            font-weight: bold;
        }
    </style>
</head>

<body class="live-theater-mode">

<div id="live-content">
    <nav class="live-nav glass">
        <div class="logo">
            <a href="index.html">
                <img src="image/MEDIA BLAST.png" alt="Mediablast Logo" style="height: 40px;">
            </a>
        </div>

        <div class="live-meta">
            <span class="live-indicator">
                <i class="fas fa-circle"></i> LIVE
            </span>

            <div class="stats-pill">
                <i class="fas fa-eye"></i>
                <span id="viewerCount">0</span>
            </div>

            <a href="index.html" class="back-home">← Back to Home</a>
        </div>
    </nav>

    <main class="live-compact-container">
        <section class="video-section-compact">
            <div class="video-wrapper glass" id="media-container">
                <div style="display: flex; align-items: center; justify-content: center; height: 100%;">
                    <p style="color: white;">Connecting to Mediablast Network...</p>
                </div>
            </div>

            <div class="video-details-compact">
                <h1 id="stream-title">Mediablast Network LIVE</h1>
            </div>
        </section>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
async function syncWithCMS() {
  const container = document.getElementById('media-container');
  const liveIndicator = document.querySelector('.live-indicator');

  try {
    // 1. Fetch data with cache busting
    const res = await fetch('/content/settings/livestream.json?nocache=' + new Date().getTime(), {
      cache: 'no-store'
    });
    
    if (!res.ok) throw new Error('Settings file not found');
    const data = await res.json();

    // 2. Clear the container before loading new content
    container.innerHTML = '';

    // 3. Logic Switch
    if (data.status === "live" && data.m3u8_url) {
      console.log("Status is LIVE");
      liveIndicator.style.display = "inline-flex";
      
      container.innerHTML = `<video id="live-player" controls autoplay playsinline style="width:100%; height:100%;"></video>`;
      
      const video = document.getElementById('live-player');
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(data.m3u8_url);
        hls.attachMedia(video);
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = data.m3u8_url;
      }
    }  
    else {
      // OFFLINE Mode
      console.log("Status is OFFLINE");
      liveIndicator.style.display = "none";
      
      container.innerHTML = `
        <div style="position: relative; width: 100%; height: 100%;">
            <video id="bg-video" autoplay muted loop playsinline style="width:100%; height:100%; object-fit:cover;">
              <source src="${data.background_video}" type="video/mp4">
            </video>
            <button id="volume-control" style="position: absolute; bottom: 20px; right: 20px; z-index: 100; background: rgba(0,0,0,0.6); color: white; border: 1px solid white; padding: 8px 15px; border-radius: 30px; cursor: pointer; font-family: sans-serif;">
                <i class="fas fa-volume-mute"></i> Unmute
            </button>
        </div>
      `;

      const v = document.getElementById('bg-video');
      const btn = document.getElementById('volume-control');

      if (v && btn) {
          v.load();
          btn.addEventListener('click', () => {
              v.muted = !v.muted; // Flip between muted and unmuted
              btn.innerHTML = v.muted ? 
                  '<i class="fas fa-volume-mute"></i> Unmute' : 
                  '<i class="fas fa-volume-up"></i> Mute';
          });
      }
    }
// Run once on load
syncWithCMS();
</script>
