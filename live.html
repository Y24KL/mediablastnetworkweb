<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE | Mediablast Network</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .video-wrapper {
            background: #000;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            aspect-ratio: 16 / 9;
        }

        #live-player, #bg-video {
            width: 100%;
            height: 100%;
            display: block;
        }

        .back-home {
            color: white;
            text-decoration: none;
            font-size: 14px;
            margin-left: 20px;
            padding: 8px 14px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            transition: 0.3s;
        }

        .back-home:hover { background: rgba(255,255,255,0.2); }

        .stats-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        .live-indicator {
            display: none;
            align-items: center;
            gap: 5px;
            color: #ff4d4d;
            font-weight: bold;
        }
    </style>
</head>

<body class="live-theater-mode">

<div id="live-content">
    <nav class="live-nav glass">
        <div class="logo">
            <a href="index.html">
                <img src="image/MEDIA BLAST.png" alt="Mediablast Logo" style="height: 40px;">
            </a>
        </div>

        <div class="live-meta">
            <span class="live-indicator">
                <i class="fas fa-circle"></i> LIVE
            </span>

            <div class="stats-pill">
                <i class="fas fa-eye"></i>
                <span id="viewerCount">0</span>
            </div>

            <a href="index.html" class="back-home">← Back to Home</a>
        </div>
    </nav>

    <main class="live-compact-container">
        <section class="video-section-compact">
            <div class="video-wrapper glass" id="media-container">
                <div style="display: flex; align-items: center; justify-content: center; height: 100%;">
                    <p style="color: white;">Connecting to Mediablast Network...</p>
                </div>
            </div>

            <div class="video-details-compact">
                <h1 id="stream-title">Mediablast Network LIVE</h1>
            </div>
        </section>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<script>
  // 1. Firebase Configuration (FIXED)
  const firebaseConfig = {
    apiKey: "AIzaSyDzDUQ1i_CPP_nL4aTefmKPADzM-UVcCt0",
    authDomain: "mbn-web-828e8.firebaseapp.com",
    databaseURL: "https://mbn-web-828e8-default-rtdb.firebaseio.com",
    projectId: "mbn-web-828e8",
    storageBucket: "mbn-web-828e8.firebasestorage.app",
    messagingSenderId: "432152602008",
    appId: "1:432152602008:web:a492785cad9a1219b337ed",
    measurementId: "G-FP2CCWHF13"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  // 2. Presence Logic
  const viewerCountSpan = document.getElementById('viewerCount');
  const vCountRef = database.ref('liveViewers');

  database.ref('.info/connected').on('value', (snapshot) => {
      if (snapshot.val() === true) {
          const myPresenceRef = vCountRef.push(true);
          myPresenceRef.onDisconnect().remove();
      }
  });

  vCountRef.on('value', (snapshot) => {
      viewerCountSpan.innerText = snapshot.numChildren();
  });

  // 3. CMS Sync Logic
  async function syncWithCMS() {
    const container = document.getElementById('media-container');
    const liveIndicator = document.querySelector('.live-indicator');

    try {
      const res = await fetch('/content/settings/livestream.json?nocache=' + new Date().getTime(), {
        cache: 'no-store'
      });
      
      if (!res.ok) throw new Error('Settings not found');
      const data = await res.json();

      if (data.status === "live" && data.m3u8_url) {
        liveIndicator.style.display = "inline-flex";
        container.innerHTML = `<video id="live-player" controls autoplay playsinline style="width:100%; height:100%;"></video>`;
        const video = document.getElementById('live-player');
        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(data.m3u8_url);
          hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = data.m3u8_url;
        }
      } else {
        liveIndicator.style.display = "none";
        container.innerHTML = `
          <div style="position: relative; width: 100%; height: 100%;">
              <video id="bg-video" autoplay muted loop playsinline style="width:100%; height:100%; object-fit:cover;">
                <source src="${data.background_video}" type="video/mp4">
              </video>
              <button id="volume-toggle" style="position: absolute; bottom: 20px; right: 20px; z-index: 10; background: rgba(0,0,0,0.6); color: white; border: 1px solid white; padding: 10px 15px; border-radius: 25px; cursor: pointer;">
                  <i class="fas fa-volume-mute"></i> Click for Sound
              </button>
          </div>
        `;

        const v = document.getElementById('bg-video');
        const btn = document.getElementById('volume-toggle');
        if (v && btn) {
            v.load();
            btn.addEventListener('click', () => {
                v.muted = !v.muted;
                btn.innerHTML = v.muted ? '<i class="fas fa-volume-mute"></i> Click for Sound' : '<i class="fas fa-volume-up"></i> Mute Audio';
            });
        }
      }
    } catch (err) {
      console.error("Sync Error:", err);
      container.innerHTML = `<p style="color:white; text-align:center; padding-top:20%;">Connecting...</p>`;
    }
  }

  syncWithCMS();
</script>
</body>
</html>
