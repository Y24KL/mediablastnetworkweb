<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE | Mediablasst Network</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .back-home {
            color: white;
            text-decoration: none;
            font-size: 14px;
            margin-left: 20px;
            padding: 8px 14px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            transition: 0.3s;
        }

        .back-home:hover {
            background: rgba(255,255,255,0.2);
        }

        .stats-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .stats-pill i {
            color: #ff4d4d;
        }
    </style>
</head>

<body class="live-theater-mode">

<div id="live-content">

    <!-- NAV -->
    <nav class="live-nav glass">
        <div class="logo">
            <a href="index.html">
                <img src="image/MEDIA BLAST.png" alt="Mediablast Logo" style="height: 40px;">
            </a>
        </div>

        <div class="live-meta">
            <span class="live-indicator">
                <i class="fas fa-circle"></i> LIVE
            </span>

            <div class="stats-pill">
                <i class="fas fa-eye"></i>
                <span id="viewerCount"></span>
            </div>

            <!-- BACK BUTTON -->
            <a href="index.html" class="back-home">
                ← Back to Home
            </a>
        </div>
    </nav>

    <!-- MAIN -->
<main class="live-compact-container">
    <section class="video-section-compact">
        <div class="video-wrapper glass" id="media-container">
            <p style="color: white; text-align: center; padding: 20px;">Connecting to Mediablast Network...</p>
        </div>

        <div class="video-details-compact">
            <h1 id="stream-title">Mediablasst Exclusive Feed</h1>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
async function syncWithCMS() {
  const container = document.getElementById('media-container');
  const titleDisplay = document.getElementById('stream-title');
  const liveIndicator = document.querySelector('.live-indicator');

  try {
    const response = await fetch('/content/settings/livestream.json', { cache: "no-store" });
    if (!response.ok) throw new Error('CMS Settings not found');

    const data = await response.json();

    // Update title
    if (data.title) titleDisplay.innerText = data.title;

    // 🔴 LIVE MODE
    if (data.status === 'live' && data.m3u8_url) {

      liveIndicator.style.display = "inline-flex";

      container.innerHTML = `
        <video id="live-player" controls autoplay playsinline 
        style="width:100%; height:100%; border-radius:12px; background:black;"></video>
      `;

      const video = document.getElementById('live-player');

      if (Hls.isSupported()) {
        const hls = new Hls({
          maxBufferLength: 30
        });

        hls.loadSource(data.m3u8_url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
        });

      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = data.m3u8_url;
      }

    } else {

      // ⏸️ OFFLINE MODE
      liveIndicator.style.display = "none";

      container.innerHTML = `
        <div style="position:relative; width:100%; height:100%;">
          
          <video id="bg-video" autoplay muted loop playsinline
            style="width:100%; height:100%; object-fit:cover; border-radius:12px;">
            <source src="${data.background_video}" type="video/mp4">
          </video>

          <!-- Overlay -->
          <div style="
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            color:white;
            text-align:center;
            background: rgba(0,0,0,0.5);
            padding:20px 30px;
            border-radius:12px;
            backdrop-filter: blur(10px);
          ">
            <h2 style="margin:0;">🔴 Stream Offline</h2>
            <p style="margin:5px 0 0;">We’ll be live shortly</p>
          </div>

        </div>
      `;

      // Fallback if video fails
      const bgVideo = document.getElementById('bg-video');
      bgVideo.onerror = () => {
        container.innerHTML = `
          <div style="
            display:flex;
            align-items:center;
            justify-content:center;
            height:100%;
            color:white;
            text-align:center;">
            <div>
              <h2>🔴 Stream Offline</h2>
              <p>Background video not available</p>
            </div>
          </div>
        `;
      };
    }

  } catch (error) {
    console.log("CMS Error:", error.message);

    container.innerHTML = `
      <div style="
        display:flex;
        align-items:center;
        justify-content:center;
        height:100%;
        color:white;">
        <p>⚠️ Unable to load stream settings</p>
      </div>
    `;
  }
}

// Auto refresh every 15 seconds (so it updates when you go live)
syncWithCMS();
setInterval(syncWithCMS, 15000);
</script>
