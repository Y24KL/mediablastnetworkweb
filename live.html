<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE | Mediablast Network</title>
    <link rel="icon" type="image/png" href="image/MEDIA BLAST.png?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
</head>

<body class="live-theater-mode">

<div id="live-content">
    <nav class="live-nav glass">
        <div class="logo">
            <a href="index.html">
                <img src="image/MEDIA BLAST.png" alt="Mediablast Logo" style="height: 40px;">
            </a>
        </div>
        <div class="live-meta" style="display: flex; align-items: center; gap: 15px;">
            <span class="live-indicator">
                <i class="fas fa-circle"></i> LIVE
            </span>
            <a href="index.html" class="back-home">&larr; Back to Home</a>
        </div>
    </nav>

    <main class="live-compact-container">
        <section class="video-section-compact">
            <div id="media-container" class="video-wrapper">
                <div id="placeholder-text" style="color:white; text-align:center; padding-top:20%;">Welcome! Please join to start the stream.</div>
            </div>
            <div class="video-details-compact">
                <h1 id="stream-title">Live Stream</h1>
            </div>
        </section>
    </main>
</div>

<div id="pre-stream-overlay" class="stream-overlay">
    <div class="stream-modal glass">
        <div class="modal-header">
            <div class="live-badge"><span class="pulse"></span> LIVE</div>
            <h2>Mediablast Network</h2>
            <p>Tell us who's watching with you</p>
        </div>
        <form id="viewer-form">
            <div class="input-group">
                <label>Your Name <span class="optional-tag">(Optional)</span></label>
                <input type="text" id="viewer-name" placeholder="Enter your name">
            </div>
            <div class="input-group">
                <label>Number of people watching <span class="optional-tag">(Optional)</span></label>
                <div class="stepper">
                    <button type="button" id="step-down" class="step-btn">&minus;</button>
                    <input type="number" id="viewer-count" value="1" min="1">
                    <button type="button" id="step-up" class="step-btn">+</button>
                </div>
            </div>
            <button type="submit" id="join-stream-btn" class="cta-btn">Join Live Stream</button>
            <div style="text-align: center; margin-top: 15px;">
                <a href="#" id="skip-link" style="color: rgba(255,255,255,0.5); font-size: 0.9rem; text-decoration: none;">Skip and watch</a>
            </div>
        </form>
    </div>
</div>

<script src="js/config.js"></script>
<script>
// --- FIREBASE CONFIG (viewer presence / "who's watching" only) ---
const firebaseConfig = {
    apiKey: "AIzaSyDzDUQ1i_CPP_nL4aTefmKPADzM-UVcCt0",
    authDomain: "mbn-web-828e8.firebaseapp.com",
    databaseURL: "https://mbn-web-828e8-default-rtdb.firebaseio.com",
    projectId: "mbn-web-828e8",
    storageBucket: "mbn-web-828e8.firebasestorage.app",
    messagingSenderId: "432152602008",
    appId: "1:432152602008:web:a492785cad9a1219b337ed",
    measurementId: "G-FP2CCWHF13"
};
// Viewer-presence tracking only — if the Firebase SDK fails to load (CDN
// hiccup, ad blocker), the stream itself must still work, so this is
// guarded rather than a hard dependency for the rest of the page.
let database = null;
try {
    firebase.initializeApp(firebaseConfig);
    database = firebase.database();
} catch (err) {
    console.error('Firebase unavailable, continuing without viewer tracking.', err);
}

document.addEventListener('DOMContentLoaded', () => {
    const overlay = document.getElementById('pre-stream-overlay');
    const form = document.getElementById('viewer-form');
    const skipLink = document.getElementById('skip-link');
    const nameInput = document.getElementById('viewer-name');
    const countInput = document.getElementById('viewer-count');
    const stepUp = document.getElementById('step-up');
    const stepDown = document.getElementById('step-down');

    if (localStorage.getItem('mbn_name')) nameInput.value = localStorage.getItem('mbn_name');

    stepUp.onclick = () => countInput.value = parseInt(countInput.value) + 1;
    stepDown.onclick = () => { if (parseInt(countInput.value) > 1) countInput.value = parseInt(countInput.value) - 1; };

    const enterStream = () => {
        overlay.classList.add('fade-out');
        syncLiveContent();
        setTimeout(() => overlay.remove(), 500);
    };

    skipLink.onclick = (e) => { e.preventDefault(); enterStream(); };

    form.onsubmit = async (e) => {
        e.preventDefault();
        const viewerData = {
            name: nameInput.value.trim() || "Anonymous",
            groupSize: parseInt(countInput.value) || 1,
            timestamp: Date.now()
        };
        try {
            if (database) {
                await database.ref('stream_entries').push(viewerData);
                const presenceRef = database.ref('liveViewers').push(viewerData.groupSize);
                presenceRef.onDisconnect().remove();
            }
            if (viewerData.name !== "Anonymous") localStorage.setItem('mbn_name', viewerData.name);
            enterStream();
        } catch (err) {
            console.error("Firebase Error:", err);
            enterStream();
        }
    };
});

/* --- Player: source of truth is the shared backend's network `live` object,
   falling back to the static data/links.json if the backend is unreachable --- */
async function syncLiveContent() {
    const container = document.getElementById('media-container');
    const liveIndicator = document.querySelector('.live-indicator');
    const titleHeader = document.getElementById('stream-title');
    const apiBase = (window.MB_CONFIG && window.MB_CONFIG.API_BASE) || '';

    let data = null;
    if (apiBase) {
        try {
            const res = await fetch(apiBase + '/api/network/content');
            if (res.ok) {
                const content = await res.json();
                data = {
                    status: content.live.status,
                    title: content.live.streamTitle,
                    youtubeLink: content.live.youtubeLink,
                    m3u8_url: content.live.m3u8Url,
                    background_video: content.live.offlineVideoUrl,
                };
            }
        } catch (err) {
            console.error('Network content fetch failed, falling back to static config.', err);
        }
    }

    if (!data) {
        try {
            const res = await fetch('data/links.json?nocache=' + Date.now());
            const fallback = await res.json();
            data = {
                status: fallback.status,
                title: fallback.title,
                youtubeLink: fallback.youtubeLink,
                m3u8_url: fallback.liveStream,
                background_video: fallback.heroVideo,
            };
        } catch (err) {
            console.error('Static fallback also failed.', err);
            return;
        }
    }

    if (data.title) titleHeader.innerText = data.title;
    const ytId = getYouTubeID(data.youtubeLink);
    const streamUrl = data.m3u8_url || '';

    if (data.status !== 'live') {
        showOfflineMode(container, liveIndicator, data.background_video);
        return;
    }

    liveIndicator.style.display = 'inline-flex';

    if (ytId) {
        container.innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${ytId}?autoplay=1&mute=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    } else if (streamUrl.includes('.m3u8')) {
        container.innerHTML = `<video id="live-player" controls autoplay playsinline></video>`;
        const video = document.getElementById('live-player');
        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else {
            video.src = streamUrl;
        }
    }
}

function showOfflineMode(container, indicator, videoUrl) {
    if (indicator) indicator.style.display = 'none';
    container.innerHTML = `
      <div style="position: relative; width: 100%; height: 100%;">
          <video id="bg-video" autoplay muted loop playsinline style="width:100%; height:100%; object-fit:cover;">
            <source src="${videoUrl}" type="video/mp4">
          </video>
          <button id="volume-toggle" style="position: absolute; bottom: 20px; right: 20px; z-index: 10; background: rgba(0,0,0,0.7); color: white; border: 1px solid white; padding: 10px 18px; border-radius: 25px; cursor: pointer;">
              Unmute Sound
          </button>
      </div>`;
    const v = document.getElementById('bg-video');
    const btn = document.getElementById('volume-toggle');
    if (v && btn) {
        btn.onclick = () => {
            v.muted = !v.muted;
            btn.innerText = v.muted ? 'Unmute Sound' : 'Mute Audio';
        };
    }
}

function getYouTubeID(url) {
    if (!url) return null;
    const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/);
    return (match && match[2].length === 11) ? match[2] : null;
}
</script>
</body>
</html>
