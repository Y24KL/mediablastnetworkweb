<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Mediablast Network</title>
    
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    
    <script>
      CMS.init({
        config: {
          backend: {
            name: 'github',
            repo: 'Y24KL/mediablastnetworkweb',
            branch: 'main', 
            base_url: 'https://netlify-cms-github-oauth-provider-1piz.onrender.com' // 👈 Don't forget to put your actual Render Proxy URL here!
          },
          media_folder: 'public/images',
          public_folder: '/images',
          collections:
  - name: "settings"
    label: "Site Settings"
    delete: false # Prevents accidental deletion of your settings
    editor:
      preview: false
    files:
      - file: "settings.json"
        label: "Stream Configuration"
        name: "stream_config"
        fields:
          - {label: "Stream URL", name: "stream_url", widget: "string", hint: "Paste your .m3u8 or universal link here"}
          - {label: "Is Live Now?", name: "is_live", widget: "boolean", default: false}
          - {label: "Stream Title", name: "stream_title", widget: "string", default: "Mediablasst Exclusive Feed"}
              ]
            }
          ]
        }
      });
    </script>
  </body>
</html>
