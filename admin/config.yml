backend:
  name: github
  repo: Y24KL/mediablastnetworkweb
  branch: main
  base_url: https://netlify-cms-github-oauth-provider-1piz.onrender.com

publish_mode: editorial_workflow # Optional: adds a 'Drafts' stage
media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
