backend:
  name: github
  repo: Y24KL/mediablastnetworkweb
  branch: main
  base_url: https://netlify-cms-github-oauth-provider-1piz.onrender.com

media_folder: "image"
public_folder: "image"

collections:
  - name: "settings"
    label: "Site Settings"
    delete: false # Prevents accidental deletion of your settings
    editor:
      preview: false
    files:
      - file: "settings.json"
        label: "Stream Configuration"
        name: "stream_config"
        fields:
          - {label: "Is Live Now?", name: "is_live", widget: "boolean", default: false}
          - {label: "Stream URL", name: "stream_url", widget: "string", required: false, hint: "Paste your live .m3u8 or streaming link here"}
          - {label: "Fallback Video URL", name: "fallback_video_url", widget: "string", required: false, hint: "Paste the URL of the .mp4 video to play in the background when offline"}
          - {label: "Stream Title", name: "stream_title", widget: "string", default: "Mediablast Exclusive Feed"}
