backend:
  name: git-gateway
  branch: main

media_folder: "image"
public_folder: "image"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - file: "settings.json"
        label: "Global Settings"
        name: "global"
       # Add this field to your existing settings collection in config.yml
fields:
  - {label: "Stream URL", name: "stream_url", widget: "string"}
  - {label: "Is Live Now?", name: "is_live", widget: "boolean", default: false}
  - {label: "Backup Video URL", name: "backup_url", widget: "string", hint: "Video to play when not live"}
