backend:
  name: github
  repo: Y24KL/mediablastnetworkweb
  branch: main
  base_url: https://netlify-cms-github-oauth-provider-1piz.onrender.com

media_folder: "image"
public_folder: "image"

collections:
  - name: "settings"
    label: "Site Settings"
    delete: false 
    editor:
      preview: false
    files:
      - file: "data/links.json" # Match this to your code's fetch path
        label: "Stream Configuration"
        name: "stream_config"
        fields:
          - {label: "Status", name: "status", widget: "select", options: ["live", "offline"], default: "offline"}
          
          - label: "YouTube Link"
            name: "youtubeLink"
            widget: "string"
            required: false
            hint: "Paste YouTube URL here (e.g., https://www.youtube.com/watch?v=...). Priority #1."

          - label: "Live Stream URL"
            name: "liveStream"
            widget: "string"
            required: false
            hint: "Paste .m3u8 OR cLoveworld URLs here. Priority #2."

          - label: "Background Video (Offline)"
            name: "heroVideo"
            widget: "string"
            required: false
            hint: "Paste Cloudinary .mp4 URL for background playback."

          - {label: "Stream Title", name: "stream_title", widget: "string", default: "Mediablast Exclusive Feed"}
