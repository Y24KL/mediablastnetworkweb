backend:
  name: github
  repo: Y24KL/mediablastnetworkweb
  branch: main
  base_url: https://netlify-cms-github-oauth-provider-1piz.onrender.com

media_folder: "image"
public_folder: "image"

collections:
  - name: "settings"
    label: "Site Settings"
    delete: false 
    editor:
      preview: false
    files:
      - file: "content/settings/livestream.json" # Ensure this path matches your fetch folder
        label: "Stream Configuration"
        name: "stream_config"
        fields:
          - {label: "Status", name: "status", widget: "select", options: ["live", "offline"], default: "offline"}
          
          - label: "YouTube Live Link"
            name: "youtube_url"
            widget: "string"
            required: false
            hint: "Paste the YouTube watch link here (e.g., https://www.youtube.com/watch?v=...) - This takes priority if filled."

          - label: "Custom Stream (m3u8)"
            name: "m3u8_url"
            widget: "string"
            required: false
            hint: "Paste your live .m3u8 link here. Only used if YouTube link is empty."

          - label: "Fallback/Background Video"
            name: "background_video"
            widget: "string"
            required: false
            hint: "Paste the Cloudinary .mp4 URL here (plays when status is offline)"

          - {label: "Stream Title", name: "stream_title", widget: "string", default: "Mediablast Exclusive Feed"}
